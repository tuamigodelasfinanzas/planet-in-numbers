name: YouTube only (manual)

# Changing .github/youtube-request sends one already-published reel (folder name in the file) to YouTube only.
on:
  push:
    branches: [main]
    paths: ['.github/youtube-request']

jobs:
  yt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Send to Make (YouTube only)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          D=$(head -1 .github/youtube-request | tr -d '[:space:]')
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media/$D"
          curl -sSf "$BASE/item.json" -o item.json
          jq -n --arg url "$BASE/reel.mp4" --slurpfile it item.json '{status:"youtube", video_url:$url, caption:$it[0].caption, title:$it[0].title}' > payload.json
          jq 'del(.caption)' payload.json
          curl -sS --fail -X POST -H 'Content-Type: application/json' --data @payload.json "$MAKE_WEBHOOK_URL"
