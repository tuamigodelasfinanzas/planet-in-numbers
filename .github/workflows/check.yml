name: Check data sources

on:
  push:
    branches: [main]
    paths: ['.github/check-request']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: ${{ secrets.IG_USER_ID }}
          MAKE_HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ "$(head -1 .github/check-request)" = "platforms" ]; then node tools/platforms-check.mjs > check-result.txt 2>&1 || true
          elif [ "$(head -1 .github/check-request | cut -d' ' -f1)" = "wb" ]; then node tools/check-wb.mjs $(head -1 .github/check-request | cut -d' ' -f2-) > check-result.txt 2>&1 || true
          elif [ "$(head -1 .github/check-request | cut -d' ' -f1)" = "igtest" ] || [ "$(head -1 .github/check-request | cut -d' ' -f1)" = "igpublish" ]; then
            # igtest = check only · igpublish = publish this carousel with music on Instagram ONLY
            MODE=$(head -1 .github/check-request | cut -d' ' -f1)
            B="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$(head -1 .github/check-request | cut -d' ' -f2)"
            curl -s "$B/caption.txt" > cap.txt; node tools/ig-carousel.mjs cap.txt $(for i in 1 2 3 4 5 6 7; do echo "$B/c0$i.mp4"; done) $([ "$MODE" = igtest ] && echo --dry) > check-result.txt 2>&1 || true
          elif [ "$(head -1 .github/check-request | cut -d' ' -f1)" = "world" ]; then node tools/check-world.mjs $(head -1 .github/check-request | cut -d' ' -f2-) > check-result.txt 2>&1 || true
          elif [ "$(head -1 .github/check-request)" = "audit" ]; then node tools/audit-topics.mjs > check-result.txt 2>&1 || true
          else node tools/check-owid.mjs $(cat .github/check-request) | sed 's/^::notice:://' > check-result.txt; fi
          cat check-result.txt
      - name: Save the report (branch "checks")
        run: |
          git config --global user.name "pin-bot"; git config --global user.email "pin-bot@users.noreply.github.com"
          mkdir r && cp check-result.txt r/ && cd r && git init -q -b checks && git add -A && git commit -q -m "check" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" checks
