name: Health check

# Every morning: checks this repo's Instagram token (valid, expiry, reaches the account) and sends it to Telegram.
# Read-only: it never renders or publishes. Make, Pages and failed runs of all three channels are checked from
# resumen-bolsa-reel (salud.yml). The logic lives in zero-understands/.github/workflows/health.yml.
on:
  # Horario automático desactivado (28/10/2026): el aviso diario lo hace ahora el centro de mando
  # (tuamigodelasfinanzas/centro-de-mando). Se puede lanzar a mano desde Actions.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
    steps:
      - id: w
        run: |
          [ "${{ github.event_name }}" = schedule ] || { echo go=true >> "$GITHUB_OUTPUT"; exit 0; }
          NOW=$(date +%s); T=$(TZ=Europe/Madrid date -d 'today 07:45' +%s); M=$(TZ=Europe/Madrid date +%H%M)
          if [ "$M" -lt 0700 ] || [ "$M" -ge 0805 ]; then echo "::notice::Madrid $M: el cron del otro horario, nada que hacer"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$NOW" -lt "$T" ] && sleep $((T - NOW))
          echo go=true >> "$GITHUB_OUTPUT"

  health:
    needs: hora
    if: needs.hora.outputs.go == 'true'
    uses: tuamigodelasfinanzas/zero-understands/.github/workflows/health.yml@main
    with:
      label: Planet in Numbers
      ig_check: true
    secrets:
      IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
